version: 2

models:
  - name: order_payment_stg
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('order_stg')
                field: order_id